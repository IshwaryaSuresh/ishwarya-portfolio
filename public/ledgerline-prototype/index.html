<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ledgerline, SME Underwriting Sandbox</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ LEDGERLINE ============ */
:root {
  /* Paper / ink */
  --paper: #faf8f2;
  --paper-2: #f3f0e6;
  --paper-3: #e8e4d6;
  --rule: #d9d4c4;
  --rule-2: #ebe7d9;
  --ink: #0e1510;
  --ink-2: #2a3128;
  --ink-3: #5a5f55;
  --ink-4: #6b6e60;

  /* Accents */
  --lime: #d4f26a;
  --lime-deep: #b8d650;
  --lime-ink: #1a2208;
  --amber: #e89a3c;
  --crimson: #c4432d;
  --teal: #3d6b5c;

  /* Semantic */
  --good: #4a7c4e;
  --warn: #b8751f;
  --bad: #a8331f;
  --good-bg: #e6eedb;
  --warn-bg: #f6e8cc;
  --bad-bg: #f4d9cf;

  /* Type, sans-serif system */
  --serif: 'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

/* ===== DARK THEME ===== */
[data-theme="dark"] {
  --paper: #0f1410;
  --paper-2: #181e19;
  --paper-3: #1f2620;
  --rule: #2a3028;
  --rule-2: #1f2520;
  --ink: #f0ebde;
  --ink-2: #d2cdc0;
  --ink-3: #9a958a;
  --ink-4: #6a665d;
  --good: #8bc09d;
  --warn: #e0b572;
  --bad: #e08a78;
  --good-bg: #1d2a23;
  --warn-bg: #2d2519;
  --bad-bg: #2d1d18;
}
[data-theme="dark"] .card.ink { background: #1a2017; color: var(--ink); border-color: #2a3028; }
[data-theme="dark"] .card.lime { background: var(--lime); color: var(--lime-ink); }
[data-theme="dark"] .btn { color: var(--ink); border-color: var(--ink); background: transparent; }
[data-theme="dark"] .btn:hover { background: var(--ink); color: var(--paper); }
[data-theme="dark"] .btn.ghost { color: var(--ink-2); border-color: var(--rule); }
[data-theme="dark"] .btn.primary { background: var(--lime); color: var(--lime-ink); border-color: var(--lime-deep); }
[data-theme="dark"] .tweaks-head { background: #1a2017; }
[data-theme="dark"] .dropzone { background: var(--paper); }
[data-theme="dark"] input, [data-theme="dark"] textarea { background: var(--paper-2); color: var(--ink); border-color: var(--rule); }

[data-accent="mint"] { --lime: #a3e4c5; --lime-deep: #7cc9a4; --lime-ink: #0c2618; }
[data-accent="amber"] { --lime: #f3c968; --lime-deep: #d9a940; --lime-ink: #2a1d05; }
[data-accent="cobalt"] { --lime: #b3c8f5; --lime-deep: #8aa8e0; --lime-ink: #0c1a3c; }

[data-density="compact"] {
  --row-h: 36px;
  --card-pad: 16px;
  --gap: 12px;
}
[data-density="comfortable"] {
  --row-h: 48px;
  --card-pad: 24px;
  --gap: 20px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--serif);
  color: var(--ink);
  background: var(--paper);
  font-size: 14.5px;
  line-height: 1.5;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "cv11";
}

button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }
table { border-collapse: collapse; }

.serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }
.mono { font-family: var(--mono); font-feature-settings: "tnum"; }
.tnum { font-variant-numeric: tabular-nums; }

/* App layout */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
  background: var(--paper);
}

/* Sidebar */
.sidebar {
  border-right: 1px solid var(--rule);
  background: var(--paper);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand {
  padding: 0 22px;
  min-height: 77px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-mark {
  font-family: var(--serif);
  font-size: 28px;
  line-height: 1;
  color: var(--ink);
  letter-spacing: -0.02em;
}
.brand-mark { font-weight: 500; }
.brand-meta {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  color: var(--ink-4);
  text-transform: uppercase;
  margin-left: auto;
}

.nav-section {
  padding: 18px 12px 8px;
}
.nav-section-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 0 10px 8px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  margin: 1px 0;
  font-size: 13.5px;
  color: var(--ink-2);
  cursor: pointer;
  border-radius: 2px;
  position: relative;
  white-space: nowrap;
}
.nav-item > span:not(.count):not(.dot):not(.nav-icon) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.nav-item .nav-icon { flex: 0 0 18px !important; width: 18px !important; max-width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-3); }
.nav-item.active .nav-icon { color: var(--ink); }
.nav-item:hover { background: var(--paper-2); }
.nav-item.active { color: var(--ink); background: var(--paper-2); }
.nav-item.active::before {
  content: "";
  position: absolute;
  left: -12px; top: 6px; bottom: 6px;
  width: 2px;
  background: var(--ink);
}
.nav-item .count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-4);
  background: var(--paper-2);
  padding: 1px 6px;
  border: 1px solid var(--rule);
}
.nav-item.active .count { background: var(--lime); color: var(--lime-ink); border-color: var(--lime-deep); }
.nav-item .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--ink-4);
}
.nav-item.active .dot { background: var(--ink); }

.nav-context {
  margin-top: auto;
  padding: 16px;
  border-top: 1px solid var(--rule);
  background: var(--paper-2);
}
.nav-context-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.nav-context-name {
  font-family: var(--serif);
  font-size: 20px;
  color: var(--ink);
  margin-top: 4px;
}
.nav-context-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 2px;
}

/* Main column */
.main {
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* Top bar */
.topbar {
  display: flex;
  align-items: center;
  padding: 16px 32px;
  min-height: 57px;
  border-bottom: 1px solid var(--rule);
  gap: 16px;
  background: var(--paper);
}
.crumbs {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-4);
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.crumbs b { color: var(--ink-2); font-weight: 500; }
.crumbs .sep { margin: 0 8px; color: var(--rule); }

.topbar-spacer { flex: 1; }

.kbd {
  font-family: var(--mono);
  font-size: 10px;
  border: 1px solid var(--rule);
  padding: 2px 6px;
  background: var(--paper);
  color: var(--ink-3);
}

.btn {
  padding: 8px 14px;
  border: 1px solid var(--ink);
  font-size: 13px;
  color: var(--ink);
  background: var(--paper);
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  line-height: 1;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn.primary { background: var(--lime); border-color: var(--lime-deep); color: var(--lime-ink); }
.btn.primary:hover { background: var(--lime-deep); color: var(--lime-ink); }
.btn.ghost { border-color: var(--rule); color: var(--ink-2); }
.btn.ghost:hover { border-color: var(--ink); background: transparent; color: var(--ink); }
.btn.sm { padding: 5px 10px; font-size: 11.5px; }
.btn.icon { padding: 6px 8px; }

/* Page */
.page {
  padding: 28px 32px 64px;
  max-width: 1440px;
  width: 100%;
}
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 28px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--rule);
}
.page-head > div:first-child { min-width: 0; flex: 1; }
.page-head .page-actions { flex-shrink: 0; padding-top: 6px; }
.page-title {
  font-family: var(--serif);
  font-size: 44px;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink);
  white-space: nowrap;
}
.page-head > div:first-child > .muted { white-space: nowrap; margin-top: 24px; max-width: none; }
.page-head > div:first-child > .muted.wrap { white-space: normal; }
.page-head:has(+ .page-desc) { border-bottom: none; padding-bottom: 0; margin-bottom: 16px; }
.page-desc { margin-top: 0 !important; padding-bottom: 18px; margin-bottom: 28px; border-bottom: 1px solid var(--rule); }
.page-title em { font-style: normal; color: var(--ink); font-weight: 600; }
.page-sub {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-top: 8px;
}
.page-actions { display: flex; gap: 10px; align-items: center; }

/* Cards */
.card {
  background: var(--paper);
  border: 1px solid var(--rule);
  padding: var(--card-pad, 24px);
}
.card.tight { padding: 16px 18px; }
.card.ink {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.card.lime {
  background: var(--lime);
  color: var(--lime-ink);
  border-color: var(--lime-deep);
}
.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 16px;
}
.card-head > div:first-child { min-width: 0; flex: 1; }
.card-head > .tag, .card-head > .btn { flex-shrink: 0; }
.card-title {
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1;
  letter-spacing: -0.01em;
}
.card-sub {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.card.ink .card-sub { color: #8a9088; }

/* Stats row (KPI) */
.kpis {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border: 1px solid var(--rule);
  background: var(--paper);
}
.kpi {
  padding: 22px 24px;
  border-right: 1px solid var(--rule);
  position: relative;
}
.kpi:last-child { border-right: 0; }
.kpi-label {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.kpi-value {
  font-family: var(--serif);
  font-size: 42px;
  line-height: 1;
  letter-spacing: -0.02em;
  margin-top: 12px;
  font-feature-settings: "tnum";
}
.kpi-value .unit { font-size: 20px; color: var(--ink-3); margin-left: 3px; }
/* Tight variant for narrow columns */
.kpis-tight { overflow: hidden; }
.kpis-tight .kpi { padding: 26px 18px; min-width: 0; overflow: hidden; }
.kpis-tight .kpi-value { font-size: 32px; margin-top: 12px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.kpis-tight .kpi-value .unit { font-size: 15px; }
.kpis-tight .kpi-label { font-size: 9.5px; letter-spacing: 0.12em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpis-tight .kpi-delta { font-size: 10.5px; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-delta {
  font-family: var(--mono);
  font-size: 11px;
  margin-top: 10px;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 6px;
}
.kpi-delta.up { color: var(--good); }
.kpi-delta.down { color: var(--bad); }

/* Grid helpers */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap, 20px); }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--gap, 20px); }
.grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--gap, 20px); }
.col-8 { grid-column: span 8; }
.col-7 { grid-column: span 7; }
.col-6 { grid-column: span 6; }
.col-5 { grid-column: span 5; }
.col-4 { grid-column: span 4; }

/* Tables */
.tbl {
  width: 100%;
  font-size: 13px;
  border: 1px solid var(--rule);
  background: var(--paper);
}
.tbl thead th {
  text-align: left;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-4);
  font-weight: 500;
  padding: 10px 12px;
  background: var(--paper-2);
  border-bottom: 1px solid var(--rule);
  white-space: nowrap;
}
.tbl tbody td {
  padding: 12px;
  border-bottom: 1px solid var(--rule-2);
  vertical-align: middle;
  height: var(--row-h, 48px);
}
.tbl tbody tr:hover { background: var(--paper-2); }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Tags */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink-3);
  line-height: 1.5;
  white-space: nowrap;
}
.tag.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tag.lime { background: var(--lime); color: var(--lime-ink); border-color: var(--lime-deep); }
.tag.good { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.tag.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.tag.bad  { background: var(--bad-bg);  color: var(--bad);  border-color: var(--bad); }
.tag .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* Category swatches */
.cat {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--ink-2);
}
.cat .sw { width: 10px; height: 10px; display: inline-block; }

/* Step bar for upload */
.steps {
  display: flex;
  gap: 2px;
  align-items: stretch;
  border: 1px solid var(--rule);
}
.step {
  flex: 1;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--paper);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-4);
  position: relative;
}
.step.active { color: var(--ink); background: var(--paper-2); }
.step.done { color: var(--ink-3); }
.step-num {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ink-4);
  line-height: 1;
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--rule);
  border-radius: 50%;
  background: var(--paper);
}
.step.active .step-num { color: var(--lime-ink); background: var(--lime); border-color: var(--lime-deep); }
.step.done .step-num { color: var(--ink-3); border-color: var(--rule); }
.step > .step-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step > .step-check { display: inline-flex; align-items: center; color: var(--good); flex-shrink: 0; }
.step:not(:last-child)::after {
  content: ""; position: absolute; right: -1px; top: 0; bottom: 0; width: 1px; background: var(--rule);
}

/* Dropzone */
.dropzone {
  border: 1.5px dashed var(--ink-4);
  padding: 60px 40px;
  text-align: center;
  background: var(--paper);
  transition: background 0.15s;
}
.dropzone:hover { background: var(--paper-2); border-color: var(--ink); }

/* Sparkline / chart area */
.chart-frame {
  width: 100%;
  display: block;
}

/* Progress bar (score breakdown) */
.bar {
  height: 8px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  position: relative;
}
.bar .fill {
  height: 100%;
  background: var(--lime);
}
.bar.bad .fill { background: var(--crimson); }
.bar.warn .fill { background: var(--amber); }

/* Big score */
.score-hero {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 32px;
  align-items: center;
}
.score-num {
  font-family: var(--serif);
  font-size: 180px;
  line-height: 0.85;
  letter-spacing: -0.04em;
  font-feature-settings: "tnum";
}
.score-num .denom {
  font-size: 48px;
  color: var(--ink-3);
  letter-spacing: -0.02em;
}

/* Dot row for mini legend */
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; display: inline-block; }

/* Alerts */
.alert {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  background: var(--paper);
  align-items: flex-start;
}
.alert + .alert { border-top: 0; }
.alert.bad { border-left: 3px solid var(--bad); }
.alert.warn { border-left: 3px solid var(--warn); }
.alert.good { border-left: 3px solid var(--good); }

.alert-icon {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: var(--paper-2);
  border: 1px solid var(--rule);
}
.alert-title { font-weight: 600; font-size: 14px; }
.alert-desc { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.alert-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-4); }

/* Tweaks panel */
.tweaks {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 320px;
  background: var(--paper);
  border: 1px solid var(--ink);
  z-index: 50;
  box-shadow: 0 20px 40px rgba(14,21,16,0.12);
}
.tweaks.hidden { display: none; }
.tweaks-head {
  padding: 12px 14px;
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--ink);
  color: var(--paper);
}
.tweaks-head .t { font-family: var(--serif); font-size: 18px; }
.tweaks-body { padding: 14px; display: grid; gap: 14px; max-height: 70vh; overflow: auto;}
.tweak-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-4);
  margin-bottom: 6px;
}
.tweak-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 11.5px;
  padding: 5px 10px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink-2);
  font-family: var(--mono);
  letter-spacing: 0.04em;
  cursor: pointer;
  white-space: nowrap;
}
.chip:hover { border-color: var(--ink); }
.chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.accent-dot { display: inline-flex; align-items: center; gap: 6px; }
.chip.accent-dot .sw { width: 10px; height: 10px; display: inline-block; border: 1px solid rgba(0,0,0,0.15); }

/* Rule editor */
.rule-row {
  display: grid;
  grid-template-columns: 28px 1fr 140px 140px 100px;
  gap: 10px;
  padding: 12px 14px;
  align-items: center;
  border-bottom: 1px solid var(--rule-2);
  font-size: 13px;
}
.rule-row:last-child { border-bottom: 0; }

const fmtINR = (n) => {
  // Indian lakhs/crores
  if (n == null) return "-";
  const abs = Math.abs(n);
  if (abs >= 1e7) return `₹${(n / 1e7).toFixed(2)}Cr`;
  if (abs >= 1e5) return `₹${(n / 1e5).toFixed(2)}L`;
  if (abs >= 1e3) return `₹${(n / 1e3).toFixed(1)}K`;
  return `₹${n.toLocaleString('en-IN')}`;
};

const fmtINRfull = (n) => {
  if (n == null) return "-";
  return `₹${n.toLocaleString('en-IN')}`;
};

// Hand-rolled SVG charts (no chart lib)

const CashflowChart = ({ data, height = 260, highlight = 2 }) => {
  const W = 600,H = height,P = { t: 16, r: 16, b: 28, l: 36 };
  const maxV = Math.max(...data.map((d) => Math.max(d.inflow, d.outflow))) * 1.1;
  const xStep = (W - P.l - P.r) / (data.length - 1);
  const y = (v) => H - P.b - v / maxV * (H - P.t - P.b);
  const x = (i) => P.l + i * xStep;

  const line = (key) => data.map((d, i) => `${i === 0 ? "M" : "L"} ${x(i).toFixed(1)} ${y(d[key]).toFixed(1)}`).join(" ");
  const area = (key) => `${line(key)} L ${x(data.length - 1)} ${H - P.b} L ${x(0)} ${H - P.b} Z`;

  const ticks = [0, 0.25, 0.5, 0.75, 1].map((t) => Math.round(maxV * t));

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart-frame">
      {/* grid */}
      {ticks.map((t, i) =>
      <g key={i}>
          <line x1={P.l} x2={W - P.r} y1={y(t)} y2={y(t)} stroke="#ebe7d9" strokeWidth="1" />
          <text x={P.l - 6} y={y(t) + 3} textAnchor="end" fontFamily="JetBrains Mono" fontSize="9" fill="#8a8d80">{t >= 1000 ? (t / 100).toFixed(0) + "K" : t}</text>
        </g>
      )}
      {/* outflow area */}
      <path d={area("outflow")} fill="#c4432d" opacity="0.08" />
      {/* inflow area */}
      <path d={area("inflow")} fill="#3d6b5c" opacity="0.1" />
      {/* lines */}
      <path d={line("outflow")} fill="none" stroke="#c4432d" strokeWidth="1.5" />
      <path d={line("inflow")} fill="none" stroke="#3d6b5c" strokeWidth="1.8" />
      {/* x labels */}
      {data.map((d, i) =>
      <text key={i} x={x(i)} y={H - 10} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="9.5" fill="#8a8d80">{d.m}</text>
      )}
      {/* highlight point */}
      {highlight != null &&
      <g>
          <line x1={x(highlight)} x2={x(highlight)} y1={P.t} y2={H - P.b} stroke="#0e1510" strokeDasharray="2 3" strokeWidth="0.8" />
          <circle cx={x(highlight)} cy={y(data[highlight].inflow)} r="4" fill="#faf8f2" stroke="#0e1510" strokeWidth="1.5" />
          <circle cx={x(highlight)} cy={y(data[highlight].outflow)} r="4" fill="#faf8f2" stroke="#c4432d" strokeWidth="1.5" />
        </g>
      }
    </svg>);

};

const Donut = ({ data, size = 220 }) => {
  const total = data.reduce((s, d) => s + d.pct, 0);
  const R = size / 2 - 4,r = R - 28,cx = size / 2,cy = size / 2;
  let acc = 0;
  const arcs = data.map((d) => {
    const a0 = acc / total * Math.PI * 2 - Math.PI / 2;
    acc += d.pct;
    const a1 = acc / total * Math.PI * 2 - Math.PI / 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const x0 = cx + R * Math.cos(a0),y0 = cy + R * Math.sin(a0);
    const x1 = cx + R * Math.cos(a1),y1 = cy + R * Math.sin(a1);
    const xi0 = cx + r * Math.cos(a0),yi0 = cy + r * Math.sin(a0);
    const xi1 = cx + r * Math.cos(a1),yi1 = cy + r * Math.sin(a1);
    return { d: `M ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1} L ${xi1} ${yi1} A ${r} ${r} 0 ${large} 0 ${xi0} ${yi0} Z`, color: d.color };
  });
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      {arcs.map((a, i) => <path key={i} d={a.d} fill={a.color} stroke="#faf8f2" strokeWidth="1" />)}
    </svg>);

};

const Sparkline = ({ data, w = 120, h = 32, color = "#0e1510" }) => {
  const max = Math.max(...data),min = Math.min(...data);
  const r = max - min || 1;
  const pts = data.map((v, i) => `${i / (data.length - 1) * w},${h - (v - min) / r * h}`).join(" ");
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.4" />
    </svg>);

};

const BalanceStrip = ({ data }) => {
  const W = 600,H = 80,P = { t: 8, r: 8, b: 16, l: 8 };
  const vals = data.map((d) => d.inflow - d.outflow);
  const max = Math.max(...vals.map(Math.abs));
  const barW = (W - P.l - P.r) / data.length - 4;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart-frame">
      <line x1={P.l} x2={W - P.r} y1={H / 2} y2={H / 2} stroke="#d9d4c4" strokeWidth="0.8" />
      {data.map((d, i) => {
        const v = d.inflow - d.outflow;
        const bh = Math.abs(v) / max * (H / 2 - P.t);
        const y = v >= 0 ? H / 2 - bh : H / 2;
        return (
          <g key={i}>
            <rect x={P.l + i * (barW + 4)} y={y} width={barW} height={bh} fill={v >= 0 ? "#3d6b5c" : "#c4432d"} opacity="0.85" />
            <text x={P.l + i * (barW + 4) + barW / 2} y={H - 4} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="8.5" fill="#8a8d80">{d.m}</text>
          </g>);

      })}
    </svg>);

};

// Upload / intake flow with animated parsing state

function ScreenUpload({ setRoute, profile }) {
  const [step, setStep] = React.useState(0); // 0=choose 1=parsing 2=review
  const [progress, setProgress] = React.useState(0);

  React.useEffect(() => {
    if (step === 1) {
      const iv = setInterval(() => {
        setProgress((p) => {
          if (p >= 100) {clearInterval(iv);setTimeout(() => setStep(2), 400);return 100;}
          return p + 4;
        });
      }, 90);
      return () => clearInterval(iv);
    }
  }, [step]);

  const start = () => {setProgress(0);setStep(1);};

  const parseLog = [
  "✓ Statement format detected: HDFC Bank Current Account",
  "✓ Parsed 432 transaction rows · Jan 01 – Dec 31, 2025",
  "✓ Reconciled running balance to statement footer (diff ₹0)",

  "◐ Detecting counterparties & recurring instruments…",
  "◐ Scanning for red-flag signatures…"];


  return (

        { n: "02", l: "Parse & categorise" },
        { n: "03", l: "Review & finalise" }].
        map((s, i) =>
        <div key={i} className={`step ${i === step ? "active" : i < step ? "done" : ""}`}>

// Red flags screen

function ScreenRedflags({ profile, showSeverity }) {
  const sorted = [...profile.flags].sort((a, b) => {
    const order = { bad: 0, warn: 1, good: 2 };
    return order[a.sev] - order[b.sev];
  });

  const stats = {
    bad: profile.flags.filter((f) => f.sev === "bad").length,
    warn: profile.flags.filter((f) => f.sev === "warn").length,
    good: profile.flags.filter((f) => f.sev === "good").length,
    penalty: profile.flags.reduce((s, f) => s + Math.abs(f.penalty), 0)
  };

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <div className="page-sub">Current file · {profile.name}</div>
          <h1 className="page-title">Red flags <em>& behaviour.</em></h1>
          <div className="muted" style={{ marginTop: 10, maxWidth: 620 }}>Pattern detectors ran across {profile.txnCount} transactions. Each flag is a rule match, click through to the offending rows.</div>
        </div>
        <div className="page-actions">
          <button className="btn ghost">Export flags</button>
        </div>
      </div>

      <div className="kpis" style={{ marginBottom: 24 }}>
        <div className="kpi"><div className="kpi-label">High severity</div><div className="kpi-value tnum" style={{ color: stats.bad > 0 ? "var(--bad)" : "var(--ink)" }}>{stats.bad}</div><div className="kpi-delta">Hard decline triggers</div></div>
        <div className="kpi"><div className="kpi-label">Medium severity</div><div className="kpi-value tnum" style={{ color: stats.warn > 0 ? "var(--warn)" : "var(--ink)" }}>{stats.warn}</div><div className="kpi-delta">Needs analyst judgement</div></div>
        <div className="kpi"><div className="kpi-label">Cleared checks</div><div className="kpi-value tnum">{stats.good}</div><div className="kpi-delta up">No findings</div></div>
        <div className="kpi"><div className="kpi-label">Total penalty</div><div className="kpi-value tnum">−{stats.penalty}<span className="unit">pts</span></div><div className="kpi-delta">Applied to score</div></div>
      </div>

      <div className="vstack" style={{ gap: 0 }}>
        {sorted.map((f, i) =>
        <div key={i} className={`alert ${f.sev}`}>
            <div className="alert-icon">
              <Icon name={f.sev === "bad" ? "warn" : f.sev === "warn" ? "warn" : "check"} size={16} />
            </div>
            <div>
              <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
                <div className="alert-title">{f.title}</div>
                {showSeverity && <SeverityChip sev={f.sev} />}
                <span className="mono" style={{ fontSize: 10.5, color: "var(--ink-4)", letterSpacing: "0.06em" }}>RULE · {f.rule}</span>
              </div>
              <div className="alert-desc">{f.desc}</div>

// ===== src/app.jsx =====
// App root

function App() {
  const [tweaks, setTweaks] = React.useState(window.TWEAKS);
  const [route, setRoute] = React.useState(() => localStorage.getItem("ll_route") || "queue");
  const [profileKey, setProfileKey] = React.useState(tweaks.profile);
  const [editOpen, setEditOpen] = React.useState(false);

  // Sync profile from tweaks
  React.useEffect(() => {setProfileKey(tweaks.profile);}, [tweaks.profile]);
  React.useEffect(() => {localStorage.setItem("ll_route", route);}, [route]);

  // Apply theme
  React.useEffect(() => {
    document.body.dataset.accent = tweaks.accent;
    document.body.dataset.density = tweaks.density;
    document.body.dataset.theme = tweaks.theme;
  }, [tweaks.accent, tweaks.density, tweaks.theme]);

  // Edit mode bridge
  React.useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') setEditOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setEditOpen(false);
    };
    window.addEventListener('message', onMsg);
    try {window.parent.postMessage({ type: '__edit_mode_available' }, '*');} catch (e) {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const profile = PROFILES[profileKey] || PROFILES.healthy;

  // Profile selector (dropdown)
  const selectProfile = (key) => {
    setProfileKey(key);
    setTweaks((t) => ({ ...t, profile: key }));
    try {window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { profile: key } }, '*');} catch (e) {}
  };

  // Workflow order for position counter
  const WORKFLOW_ORDER = ["queue", "upload", "transactions", "cashflow", "collateral", "scorecard", "redflags", "rules", "cohort", "experiments"];
  const routeIdx = WORKFLOW_ORDER.indexOf(route);
  const routePos = routeIdx >= 0 ? { idx: routeIdx + 1, total: WORKFLOW_ORDER.length } : null;

  // Crumbs per route
  const crumbMap = {
    queue: ["Ledgerline", "Desk", "Queue"],
    upload: ["Ledgerline", "Workflow", "New intake"],
    transactions: ["Ledgerline", profile.name, "Transactions"],
    cashflow: ["Ledgerline", profile.name, "Cashflow"],
    collateral: ["Ledgerline", profile.name, "Collateral"],
    scorecard: ["Ledgerline", profile.name, "Scorecard"],
    redflags: ["Ledgerline", profile.name, "Red Flags"],
    rules: ["Ledgerline", "Config", "Rules"],
    cohort: ["Ledgerline", profile.name, "Cohort"],
    experiments: ["Ledgerline", "Config", "Experiments"]
  };
  if (tweaks.brand === "CreditCraft") crumbMap[route][0] = "CreditCraft";

  return (
    <div className="app" data-screen-label={route}>
      <Sidebar route={route} setRoute={setRoute} profile={profile} brand={tweaks.brand} />
      <div className="main">
        <Topbar crumbs={crumbMap[route]} routePos={routePos} profile={profile} profileKey={profileKey} onSelectProfile={selectProfile} />
        {route === "queue" && <ScreenQueue setRoute={setRoute} setProfile={setProfileKey} />}
        {route === "upload" && <ScreenUpload setRoute={setRoute} profile={profile} />}
        {route === "transactions" && <ScreenTransactions profile={profile} />}
        {route === "cashflow" && <ScreenCashflow profile={profile} />}
        {route === "collateral" && <ScreenCollateral profile={profile} setRoute={setRoute} />}
        {route === "scorecard" && <ScreenScorecard profile={profile} setRoute={setRoute} heroMode={tweaks.heroScore} />}
        {route === "redflags" && <ScreenRedflags profile={profile} showSeverity={tweaks.showSeverity} />}
        {route === "rules" && <ScreenRules />}
        {route === "cohort" && <ScreenCohort profile={profile} />}
        {route === "experiments" && <ScreenExperiments />}
      </div>
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} open={editOpen} setOpen={setEditOpen} />
    </div>);

}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);


</script>
